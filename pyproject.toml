[project]
name = "qwen-steering"
version = "0.1.0"
description = "Local Qwen3.5 neuron steering with PyTorch hooks"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.6,<3",
    "transformers==5.20.2",
    "accelerate>=1,<2",
    "huggingface-hub>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
