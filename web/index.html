<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111113">
  <title>qwen</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Steering controls">
      <div class="panel-heading"><h1>steering</h1><label class="switch"><input id="enabled" type="checkbox" checked aria-label="Enable steering"><span></span></label></div>
      <div class="neuron" id="neuron-one">
        <div class="neuron-top"><label for="dose-one">l14 / n8949</label><output id="value-one" for="dose-one">+1.0</output></div>
        <input id="dose-one" type="range" min="-2" max="2" step="0.1" value="1" aria-label="Layer 14 neuron 8949 dose">
        <div class="range-labels"><span>−2</span><span>0</span><span>+2</span></div>
      </div>
      <div class="neuron" id="neuron-two">
        <div class="neuron-top"><label for="dose-two">l13 / n7956</label><output id="value-two" for="dose-two">−1.0</output></div>
        <input id="dose-two" type="range" min="-2" max="2" step="0.1" value="-1" aria-label="Layer 13 neuron 7956 dose">
        <div class="range-labels"><span>−2</span><span>0</span><span>+2</span></div>
      </div>
      <button class="text-button" id="reset-doses" aria-label="Reset doses">reset</button>
      <label class="length-label" for="length">reply length <select id="length"><option value="64">short</option><option value="128" selected>standard</option><option value="256">long</option></select></label>
      <div class="model-card">
        <div class="model-state"><span id="status-dot" class="dot inactive"></span><span id="model-status" role="status">checking model…</span></div>
        <button id="load-model" class="secondary">load model</button>
        <details id="setup"><summary>setup</summary>
          <div class="setup-content"><label for="model-path">weights folder</label><input id="model-path" type="text" spellcheck="false" placeholder="/path/to/weights"><code>uv run python run.py download</code><p id="disk-space"></p></div>
        </details>
      </div>
    </aside>
    <main class="conversation" aria-label="Chat">
      <div id="messages" class="messages" role="log" aria-label="Conversation"></div>
      <div class="compose-wrap">
        <div id="notice" class="notice" role="status" hidden></div>
        <form id="composer" class="composer"><label class="sr-only" for="prompt">Message Qwen</label><textarea id="prompt" rows="1" placeholder="message…" maxlength="16000" title="Enter to send, Shift+Enter for a new line"></textarea><button id="send" type="submit" aria-label="Send message" disabled>↑</button></form>
      </div>
    </main>
  </div>
</body>
</html>
